# The play domain. Deploy with `npx wrangler deploy` from this folder.
name = "launchtitle-play"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Every game's subdomain. Needs a proxied wildcard DNS record on the zone.
routes = [{ pattern = "*.launchtitle.games/*", zone_name = "launchtitle.games" }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "launchtitle-games"
